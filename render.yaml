# Render Blueprint: one-click deploy of Nightfall on Render's free tier.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: nightfall
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /opt/render/project/src/data
      # unlocks /admin/stats?token=<value>; Render generates a random value, readable under Environment
      - key: ADMIN_TOKEN
        generateValue: true
      # Postgres connection string (e.g. a free Neon database) so scores, names
      # and stats survive restarts. Render asks for the value; leave it empty to use files.
      - key: DATABASE_URL
        sync: false
    # Free instances have no persistent disk: without DATABASE_URL the
    # leaderboard, names and stats reset on every deploy or restart.
